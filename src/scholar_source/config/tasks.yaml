# Shared constants (referenced in agent descriptions, not repeated per task)
# BLACKLISTED_PLATFORMS: khanacademy.org, coursera.org, udemy.com, edx.org, udacity.com,
#   brilliant.org, thinkific.com, teachable.com, podia.com
# BLACKLISTED_URL_PATTERNS: /premium/, /pro/, /subscription/, /members-only/
# USA_ONLY: MIT, Stanford, Berkeley, OpenStax, .edu domains

course_analysis_task:
  description: >
    Extract topics from the provided source. ONE fetch maximum.

    INPUT ROUTING (check in order, use first match):

    {book_url} OR (ISBN search finds a book URL):
      Use "Table of Contents Extractor" tool ONCE. Extract ONLY chapter/section titles.
      Do NOT read full content or follow links. Stop after TOC.
      Set textbook_source="book_url" (or "isbn_lookup" if found via ISBN search).

    {isbn} (no book_url):
      Search: "ISBN {isbn}" via Serper. Verify ISBN matches exactly.
      Extract title and author. If a book URL is found, treat as book_url above.
      Otherwise, infer general topics from title/author.

    {book_pdf_path} (no book_url):
      Use "Table of Contents Extractor" with {book_pdf_path} as URL. Extract TOC only.
      Set textbook_source="uploaded_pdf".

    {course_url} (no book inputs):
      Fetch ONCE. Extract topics from syllabus/description.
      Follow syllabus link if present (1 extra fetch max).

    {topics_list}:
      Use as user_specified_topics. Set search_priority="user_topics".

    CHAPTER/SECTION HANDLING:
      If {chapter} is non-empty: set search_mode="chapter_aware".
        Identify all TOC sections belonging to {chapter} (by number or name).
        If {sections} non-empty: only include those specific sections (comma-separated).
        Else: return all matched sections as chapter_sections.
        If no match: use all top-level topics.
      Else: set search_mode="standard", chapter_sections=[].

    Inputs: {course_url}, {book_url}, {book_pdf_path}, {topics_list}, {isbn}, {chapter}, {sections}

  expected_output: >
    JSON with keys: textbook_title, textbook_author, textbook_source,
    general_course_topics, user_specified_topics, search_priority,
    subject_keywords, search_mode, chapter_sections

  agent: course_intelligence_agent


resource_search_task:
  description: >
    Search for high-quality free resources from USA-based sources matching course topics.

    RESOURCE TYPE FILTER (check first — highest priority):
    If {desired_resource_types} is non-empty, ONLY return those types. No exceptions.
    Type mapping: "practice_problem_sets"→practice_problem/problem_set,
    "practice_exams_tests"→practice_exam/test, "lecture_videos"→video_lecture/lecture_series/educational_video.
    If empty: use default priority: practice_exams_tests > practice_problem_sets > lecture_videos.

    If {book_url} or {isbn} provided: do NOT include textbooks/open_textbooks.

    USA-ONLY: Accept MIT, Stanford, Berkeley, OpenStax, .edu domains.
    Reject non-US institutions (e.g., cambridge.ac.uk, oxford.ac.uk).
    Reject blacklisted platforms (see agent config).

    TOPIC MATCHING:
    search_priority="user_topics" → search only user_specified_topics.
    search_priority="general_topics" → search general_course_topics.
    Verify subject_keywords match to prevent cross-discipline results.

    SEARCH EXECUTION (Serper — pass plain string only):
    Run 5-7 targeted searches. Include USA university names.
    For practice resources, prefer:
      "[topic] problem set PDF site:ocw.mit.edu"
      "[topic] exam problems PDF site:edu"
      "[topic] pset PDF Harvard Stanford Berkeley"
    Prioritize .pdf URLs from .edu domains.

    PRACTICE RESOURCE QUALITY:
    Only include multi-problem packets (5+ problems). Prefer PDFs with "exam", "homework",
    "pset", "worksheet" in title/URL. Reject single-problem worked examples.

    CHAPTER-AWARE MODE (when search_mode=="chapter_aware"):
    Search SECTION BY SECTION (not a broad search).
    Per section: 3+ resources, set section_name field to exact section name.
    If {preferred_creators}: run "[section] [creator] site:youtube.com" per creator per section.
    Default educators (if no preferred_creators): Professor Leonard, PatrickJMT, 3Blue1Brown,
    Dr. Trevor Bazett, blackpenredpen, NancyPi, Michel van Biezen.
    Also search: "[section] lecture video site:youtube.com" and use YoutubeVideoSearchTool.
    Target: 3+ resources × N sections.

    If {targeted_sites}: prioritize those domains (2-3 resources target).
    If {excluded_sites}: reject any URL containing those strings.

    Inputs: {targeted_sites}, {excluded_sites}, {desired_resource_types},
    {preferred_creators}, course_analysis_task output

  expected_output: >
    JSON list. Each resource: resource_title, resource_type, url, coverage_topics,
    source_credibility, access_notes, estimated_depth, alignment_with_book,
    selection_rationale, section_name (chapter-aware mode only).
    Standard mode: 5-7 resources. Chapter-aware: 3+ per section.

  agent: resource_discovery_agent


resource_validation_task:
  description: >
    Validate resources for quality, accessibility, and relevance. Process checks in order —
    stop and reject as soon as any check fails. Minimize API/web calls.

    VALIDATION ORDER (fail-fast):

    0. Preserve section_name field unchanged on all resources.

    1. TYPE FILTER: If {desired_resource_types} non-empty, reject any resource whose
       resource_type doesn't match. rejection_reason="Type not in requested types."

    2. EXCLUDED SITES: If {excluded_sites}, reject URL containing any excluded string.

    3. PLATFORM AUTO-REJECT (no API calls — string match on URL):
       Reject: khanacademy.org, coursera.org, udemy.com, edx.org, udacity.com,
       brilliant.org, thinkific.com, teachable.com, podia.com
       Reject URLs with: /premium/, /pro/, /subscription/, /members-only/

    4. METADATA CHECKS (no API calls):
       a) Topic relevance: coverage_topics must match subject_keywords. Score=0 if wrong discipline.
       b) URL format:
          - PDFs end in .pdf; YouTube contains youtube.com or youtu.be
          - LibreTexts: full path required (e.g., math.libretexts.org/Bookshelves/...)
          - MIT OCW: ocw.mit.edu/courses/[dept]/[number]-[name]-[term]-[year]/
          - OpenStax: openstax.org/books/[book-name] (not /details/books/)
          - Reject incomplete/truncated URLs
       c) NotebookLM compatibility: PDF, YouTube, standard web = compatible. Reject interactive/login.
       d) Source credibility: Trusted if .edu domain or known open platform (MIT OCW, OpenStax).
       e) Practice depth: Reject if "worked_example" or "we_" in URL/title. Prefer "pset/homework/exam".

    5. WEB VERIFICATION (last resort — 1-2 calls max per resource):
       Only for: suspicious/uncommon URLs, personal faculty pages, unknown platforms.
       Skip for: MIT OCW, OpenStax, YouTube, already-validated metadata.

    SCORING (1-10): Relevance 40%, Comprehensiveness 30%, Credibility 20%, Usability 10%.
    Set score=0 for wrong subject area.

    Inputs: {excluded_sites}, {desired_resource_types}, resources from resource_search_task

  expected_output: >
    Approved resources (5-7 target): all original fields plus validation_status="approved",
    notebooklm_compatible, notebooklm_format, usefulness_score, validation_notes.
    Rejected resources (summary only): resource_title, url, rejection_reason.
    Summary: total validated, approved, rejected, average score, note if <5 approved.

  agent: resource_validator_agent


final_output_task:
  description: >
    Create a student-friendly markdown resource guide for NotebookLM.

    FINAL SAFETY CHECK: Before formatting, remove any resources from blacklisted platforms
    (khanacademy.org, coursera.org, udemy.com, edx.org, udacity.com, brilliant.org).

    DOCUMENT STRUCTURE:

    1. Textbook Info (from course_analysis_task): title + author if found, else omit section.

    2. Course Overview: 2-3 sentences on scope, key topics, note if user_specified_topics used.

    3. Resources:
       Standard mode: organize by topic/type. Include title, link, description, best-for, score.
       Chapter-aware mode: group by section using EXACTLY "### Section: [Name]" headers (required for parsing).
       Per resource: **Title** (Type), Link, What it covers, Best for, Usefulness Score ⭐️ X/10.

    4. NotebookLM Instructions (PDFs / YouTube / Web Pages — 3 steps each).

    5. Study Tips: using multiple sources, maximizing NotebookLM features.

    FORMATTING: Markdown, ##/### headers, emoji (📚🎯📥💡), clickable URLs, 2-4 pages,
    encouraging tone.

    Inputs: course_analysis_task output, validated resources from resource_validator_agent

  expected_output: >
    Formatted markdown document with sections: Study Resources title, Textbook Info,
    Course Overview, Recommended Resources (section-grouped if chapter-aware),
    How to Add to NotebookLM, Study Tips, total resource count footer.
    All resources free, legal, and openly accessible.

  agent: output_formatter_agent