[project]
name = "scholar_source"
version = "1.2.0"
description = "scholar-source using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]==0.203.2",
    "lancedb==0.25.3",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "python-multipart==0.0.29",
    "pydantic[email]==2.12.5",
    "supabase==2.30.0",
    "python-dotenv==1.2.2",
    "resend==2.30.1",
    "slowapi==0.1.9",
    "redis==7.4.0",
    "celery==5.6.3",
    "PyJWT==2.13.0",
    "cryptography==48.0.0",
    "pypdf>=6.10.2,<7.0.0",
    "filetype==1.2.0",
    "aiohttp==3.13.5",
    "filelock==3.20.3",
    "idna==3.16",
    "lxml==6.1.1",
    "orjson==3.11.9",
    "pdfminer-six==20251230",
    "pillow==12.2.0",
    "pyarrow==23.0.1",
    "pyasn1==0.6.3",
    "pygments==2.20.0",
    "urllib3==2.7.0",
    "langchain-openai==1.3.3",
    "langsmith==0.9.5",
]

[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    # HTTP testing
    "httpx>=0.28.1",
    # Mocking and fixtures
    "fakeredis>=2.35.1",
    "faker>=40.19.1",
    # Code quality
    "ruff>=0.14.8",
    "mypy>=2.1.0",
    "virtualenv>=20.36.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
scholar_source = "scholar_source.main:run"
run_crew = "scholar_source.main:run"
train = "scholar_source.main:train"
replay = "scholar_source.main:replay"
test = "scholar_source.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
